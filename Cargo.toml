[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/ndbeals/PCPanel-rs"

[workspace.dependencies]
pcpanel-core = { path = "crates/pcpanel-core" }
pcpanel-hid = { path = "crates/pcpanel-hid" }
pcpanel-audio = { path = "crates/pcpanel-audio" }
pcpanel-ipc = { path = "crates/pcpanel-ipc" }
# GPUI Fast backend (https://github.com/longbridge/gpui-fast): verified for the overlay PoC.
gpui-kit = { version = "0.11.0", features = ["gpui-fast"] }

# `unsafe` is denied everywhere; a module that genuinely needs it opts in with
# `#![allow(unsafe_code)]` and a `// SAFETY:` comment on every block.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Fast iteration: lean debug info for our crates; optimize third-party deps (but not our
# code) so debug builds stay usable for hardware, audio and GUI work.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

# GPUI's hot crates at opt-level 3, per https://gpui-kit.com/docs/installation (slower first
# build, much snappier debug UI).
[profile.dev.package."gpui-pre"]
opt-level = 3

[profile.dev.package."gpui-pre-platform"]
opt-level = 3

[profile.dev.package."gpui-component"]
opt-level = 3

[profile.dev.package."gpui-fast"]
opt-level = 3

[profile.dev.package."gpui-fast-windows"]
opt-level = 3

[profile.dev.package."gpui-kit"]
opt-level = 3

[profile.dev.package."gpui-kit-assets"]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

[profile.dev.package."ttf-parser"]
opt-level = 3
