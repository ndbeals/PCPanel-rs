[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-only"
repository = "https://github.com/ndbeals/PCPanel-rs"

[workspace.dependencies]
pcpanel-core = { path = "crates/pcpanel-core" }
pcpanel-hid = { path = "crates/pcpanel-hid" }
pcpanel-audio = { path = "crates/pcpanel-audio" }
pcpanel-ipc = { path = "crates/pcpanel-ipc" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Fast iteration: lean debug info for our crates; optimize third-party deps (but not our
# code) so debug builds stay usable for hardware, audio and GUI work.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
