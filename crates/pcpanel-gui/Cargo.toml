[package]
name = "pcpanel-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "pcpanel-gui"
path = "src/main.rs"

[dependencies]
pcpanel-core.workspace = true
pcpanel-ipc.workspace = true
gpui-kit.workspace = true

# Native styling of the overlay window (no frame/shadow, click-through).
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }
